version: "3.8"

services:
  main-client:
    image: open-data/main-client
    build:
      context: ./apps/clients/main
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_DASHBOARD_URL=http://localhost:3001
      - VITE_NATIONAL_BANK_URL=http://localhost:3002
    restart: unless-stopped

  dashboard-client:
    image: open-data/dashboard-client
    build:
      context: ./apps/clients/dashboard
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    environment:
      - VITE_API_URL=http://localhost:5001
    restart: unless-stopped

  dashboard-service:
    image: open-data/dashboard-service
    build:
      context: ./apps/services/dashboard
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - CORS_ORIGIN=http://localhost:3000
    restart: unless-stopped

  national-bank-client:
    image: open-data/national-bank-client
    build:
      context: ./apps/clients/national-bank
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    environment:
      - VITE_API_URL=http://localhost:5002
    restart: unless-stopped

  national-bank-service:
    image: open-data/national-bank-service
    build:
      context: ./apps/services/national-bank
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
      - CORS_ORIGIN=http://localhost:3000
    restart: unless-stopped
